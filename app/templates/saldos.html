{% extends "base.html" %}
{% block titulo %}Saldos{% endblock %}
{% block cabecalho %}Saldos{% endblock %}

{% block conteudo %}
<p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

<div class="barra-acoes">
  <button type="button" id="botao-atualizar" class="botao-secundario">Atualizar saldos</button>
</div>

<section aria-labelledby="titulo-total-geral">
  <h2 id="titulo-total-geral">Total geral</h2>
  <dl class="totais" id="total-geral">
    <div><dt>Materiais</dt><dd id="total-materiais">–</dd></div>
    <div><dt>Unidades em estoque</dt><dd id="total-unidades">–</dd></div>
    <div><dt>Indisponíveis</dt><dd id="total-indisponiveis">–</dd></div>
  </dl>
</section>

<div id="grupos"></div>
<p id="vazio" hidden>Nenhuma categoria cadastrada.</p>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', path='js/saldos.js') }}"></script>
{% endblock %}
