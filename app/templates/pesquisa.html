{% extends "base.html" %}
{% block titulo %}Pesquisa{% endblock %}
{% block cabecalho %}Pesquisa{% endblock %}

{% block conteudo %}
<p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

<form id="filtros" class="filtros" role="search" aria-label="Filtrar materiais" novalidate>
  <div class="campo">
    <label for="filtro-busca">Buscar por nome</label>
    <input id="filtro-busca" type="search" autocomplete="off">
  </div>
  <div class="campo">
    <label for="filtro-categoria">Categoria</label>
    <select id="filtro-categoria">
      <option value="">Todas as categorias</option>
    </select>
  </div>
  <div class="campo">
    <label for="filtro-disponivel">Disponível</label>
    <select id="filtro-disponivel">
      <option value="">Todos</option>
      <option value="Disponível">Sim</option>
      <option value="Indisponível">Não</option>
    </select>
  </div>
</form>

<p id="resumo" class="resumo" role="status" aria-live="polite"></p>
<div id="grupos" data-pode-excluir="{{ 'sim' if pode_excluir_material else 'nao' }}"></div>
<p id="vazio" hidden></p>

<dialog id="dialogo-exclusao" aria-labelledby="titulo-dialogo-exclusao" aria-describedby="texto-exclusao">
  <div class="form-vertical">
    <h2 id="titulo-dialogo-exclusao">Excluir material</h2>
    <p id="texto-exclusao"></p>
    <div class="acoes-form">
      <button type="button" id="botao-confirmar-exclusao" class="botao-perigo">Excluir material</button>
      <button type="button" id="botao-cancelar-exclusao" class="botao-secundario" autofocus>Cancelar</button>
    </div>
  </div>
</dialog>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', path='js/pesquisa.js') }}"></script>
{% endblock %}
